<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motor de rezervari directe</title>
  <meta name="description" content="Un flux de rezervare direct, simplu si eficient, pentru hoteluri, vile si alte unitati de cazare." data-i18n-meta-description>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20260525b">
  <link rel="stylesheet" href="css/themes/pursisimpluvama_theme.css?v=20260525b">
  <link rel="stylesheet" href="css/responsive.css?v=20260525b">
</head>
<body data-page="home">
  <div class="site-shell">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="Direct Booking Engine home">
        <span class="brand-mark" data-theme-brand-mark>PS</span>
        <span>
          <strong data-i18n="brandName" data-theme-brand-name>Pur si Simplu</strong>
          <small data-i18n="brandTagline">Flux direct de rezervare</small>
        </span>
      </a>
      <div class="header-tools">
        <label class="language-switcher">
          <span data-i18n="languageLabel">Limba</span>
          <select data-language-switcher aria-label="Language selector">
            <option value="ro">RO</option>
            <option value="en">EN</option>
          </select>
        </label>
      </div>
    </header>

    <main>
      <section class="search-panel surface-card" id="search-panel" aria-labelledby="search-title">
        <div class="search-intro">
          <p class="eyebrow" data-i18n="homeEyebrow">Intrare in rezervare</p>
          <h2 id="search-title" data-i18n="homeSearchTitle">Verifica disponibilitatea si continua catre selectia camerei</h2>
        </div>
        <form class="booking-search-form" data-search-form>
          <label>
            <span data-i18n="labelCheckin">Check-in</span>
            <input type="date" name="checkin" required>
          </label>
          <label>
            <span data-i18n="labelCheckout">Check-out</span>
            <input type="date" name="checkout" required>
          </label>
          <label>
            <span data-i18n="labelGuests">Persoane</span>
            <div class="guest-stepper" data-guest-stepper>
              <button type="button" class="guest-stepper-button" data-guest-step="decrease" data-i18n-aria-label="guestCounterDecrease" aria-label="Reduce numarul de persoane">-</button>
              <output class="guest-stepper-value" data-guest-count-display aria-live="polite"></output>
              <button type="button" class="guest-stepper-button" data-guest-step="increase" data-i18n-aria-label="guestCounterIncrease" aria-label="Creste numarul de persoane">+</button>
              <input type="hidden" name="guests" value="2" required>
            </div>
          </label>
          <button class="button button-primary button-search" type="submit" data-i18n="buttonViewAvailability">Vezi disponibilitatea</button>
        </form>
      </section>
    </main>

    <footer class="footer footer-minimal" aria-hidden="true"></footer>
  </div>

  <script type="module" src="js/app.js?v=20260525b"></script>
</body>
</html>
