<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar rezervari | Booking Engine</title>
  <meta name="description" content="Calendar administrativ pentru rezervari si ocuparea camerelor." data-admin-meta-description>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20260708a">
  <link rel="stylesheet" href="css/themes/pursisimpluvama_theme.css">
  <link rel="stylesheet" href="css/responsive.css?v=20260708a">
</head>
<body data-page="admin-calendar">
  <div class="site-shell">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="Booking Engine home">
        <span class="brand-mark" data-theme-brand-mark>PS</span>
        <span>
          <strong data-admin-i18n="brandName" data-theme-brand-name>Pur si Simplu</strong>
          <small data-admin-i18n="brandTagline">Flux direct de rezervare</small>
        </span>
      </a>
      <div class="header-tools">
        <nav class="nav" aria-label="Primary">
          <a href="index.html" data-admin-i18n="navPublic">Frontend public</a>
          <a href="admin-panel.html" data-admin-i18n="navAdminPanel">Panou administrativ</a>
          <a href="admin-calendar.html" aria-current="page" data-admin-i18n="navAdminCalendar">Calendar rezervari</a>
        </nav>
        <label class="language-switcher">
          <span data-admin-i18n="languageLabel">Limba</span>
          <select data-admin-language-switcher aria-label="Language selector">
            <option value="ro">RO</option>
            <option value="en">EN</option>
          </select>
        </label>
      </div>
    </header>

    <main>
      <section class="admin-shell surface-card">
        <div class="admin-feedback" data-admin-feedback hidden></div>

        <div class="admin-toolbar">
          <div class="admin-summary">
            <span class="status-pill" data-admin-booking-summary>0 <span data-admin-i18n="bookingsTab">Rezervari</span></span>
            <span class="status-pill" data-admin-room-summary>0 <span data-admin-i18n="roomsTab">Camere</span></span>
            <span class="status-pill" data-admin-session-summary data-admin-i18n="sessionUnknown">Sesiune activa</span>
          </div>
          <div class="admin-toolbar-actions">
            <button class="button button-secondary" type="button" data-admin-open-table-view data-admin-i18n="buttonTableView">Tabel rezervari</button>
            <button class="button button-secondary" type="button" data-admin-calendar-today data-admin-i18n="buttonToday">Astazi</button>
            <button class="button button-secondary" type="button" data-admin-refresh data-admin-i18n="buttonRefresh">Reincarca</button>
            <button class="button button-secondary" type="button" data-admin-logout data-admin-i18n="buttonLogout">Deconectare</button>
          </div>
        </div>

        <section class="admin-panel admin-calendar-panel">
          <div class="admin-panel-heading">
            <div>
              <p class="eyebrow" data-admin-i18n="calendarEyebrow">Calendar</p>
              <h2 data-admin-i18n="calendarTitle">Calendar rezervari</h2>
            </div>
            <div class="admin-bookings-tools">
              <label class="admin-bookings-filter">
                <input type="checkbox" data-admin-show-all-bookings>
                <span data-admin-i18n="bookingShowAllLabel">Afiseaza toate rezervarile</span>
              </label>
            </div>
          </div>
          <div class="admin-calendar-board" data-admin-calendar-board></div>
        </section>
      </section>
    </main>

    <div class="admin-modal" data-admin-calendar-booking-modal hidden>
      <div class="admin-modal-backdrop" data-admin-close-calendar-booking-modal></div>
      <div class="admin-modal-card admin-calendar-booking-modal-card">
        <div class="admin-modal-header">
          <div>
            <p class="eyebrow" data-admin-i18n="calendarBookingDetailsEyebrow">Rezervare</p>
            <h2 data-admin-i18n="calendarBookingDetailsTitle">Detalii rezervare</h2>
          </div>
          <button class="admin-modal-close" type="button" data-admin-close-calendar-booking-modal aria-label="Close">×</button>
        </div>
        <div class="admin-modal-body">
          <div class="admin-calendar-booking-detail" data-admin-calendar-booking-detail></div>
        </div>
      </div>
    </div>

    <footer class="footer footer-minimal" aria-hidden="true"></footer>
  </div>

  <script type="module" src="js/admin.js?v=20260708a"></script>
</body>
</html>
