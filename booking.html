<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalii rezervare | Booking Engine</title>
  <meta name="description" content="Confirma camera selectata, completeaza datele clientului si continua catre plata securizata." data-i18n-meta-description>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/themes/pursisimpluvama_theme.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="booking">
  <div class="site-shell">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="Booking Engine home">
        <span class="brand-mark" data-theme-brand-mark>PS</span>
        <span>
          <strong data-i18n="brandName" data-theme-brand-name>Pur si Simplu</strong>
          <small data-i18n="brandTagline">Flux direct de rezervare</small>
        </span>
      </a>
      <div class="header-tools">
        <label class="language-switcher">
          <span data-i18n="languageLabel">Limba</span>
          <select data-language-switcher aria-label="Language selector">
            <option value="ro">RO</option>
            <option value="en">EN</option>
          </select>
        </label>
      </div>
    </header>

    <main>
      <section class="page-hero compact">
        <div>
          <h1 data-i18n="bookingTitle">Completeaza detaliile rezervarii.</h1>
        </div>
      </section>

      <section class="booking-layout">
        <aside class="surface-card summary-card" data-booking-summary aria-live="polite"></aside>

        <section class="surface-card form-card">
          <div class="section-heading">
            <div>
              <h2 data-i18n="bookingFormTitle">Informatii client</h2>
            </div>
          </div>
          <form class="guest-form" data-guest-form>
            <label for="firstName">
              <span data-i18n="labelFirstName">Prenume</span>
              <input id="firstName" name="firstName" type="text" autocomplete="given-name" required>
            </label>
            <label for="lastName">
              <span data-i18n="labelLastName">Nume</span>
              <input id="lastName" name="lastName" type="text" autocomplete="family-name" required>
            </label>
            <label class="guest-form-field-wide" for="email">
              <span data-i18n="labelEmail">Email</span>
              <input id="email" name="email" type="email" autocomplete="email" required>
            </label>
            <div class="phone-field-grid guest-form-field-wide">
              <label for="phoneCountry">
                <span data-i18n="labelPhoneCountry">Tara / prefix</span>
                <select id="phoneCountry" name="phoneCountry" data-phone-country autocomplete="country-name" required></select>
              </label>
              <label for="mobilePhoneNumber">
                <span data-i18n="labelMobilePhoneNumber">Numar de telefon</span>
                <input id="mobilePhoneNumber" name="mobilePhoneNumber" type="tel" autocomplete="tel" inputmode="tel" required>
              </label>
            </div>
            <label class="guest-form-field-wide">
              <span data-i18n="labelGuests">Persoane</span>
              <div class="readonly-field" data-booking-guests-display aria-live="polite"></div>
            </label>
            <div class="form-feedback guest-form-field-wide" data-guest-form-feedback role="alert" hidden></div>
            <button class="button button-primary button-full" type="submit" data-i18n="buttonContinuePayment">Continua catre plata</button>
          </form>
        </section>
      </section>
    </main>

    <footer class="footer footer-minimal" aria-hidden="true"></footer>
  </div>

  <script type="module" src="js/app.js?v=20260514h"></script>
</body>
</html>
